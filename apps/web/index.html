<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="light dark" />
		<title>Longan</title>
		<script>
			// Apply the stored dark-mode override before first paint to avoid a flash.
			(() => {
				let o = null;
				try {
					o = localStorage.getItem("longan-dark-mode");
				} catch {}
				if (o === "dark" || (o === null && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
					document.documentElement.classList.add("dark");
				}
			})();
		</script>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
