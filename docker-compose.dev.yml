# Local development dependencies only: Postgres + Keycloak (with the dev realm imported).
# App runs on the host: `pnpm dev`.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: longan
      POSTGRES_PASSWORD: longan
      POSTGRES_DB: longan
    ports: ["127.0.0.1:5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U longan"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro

volumes:
  pgdata:
