# Full stack: Longan + Postgres + Keycloak (dev realm imported from docker/keycloak).
#   docker compose up --build        -> http://localhost:3100 (users admin/admin, alice/alice, bob/bob)
# For development with the app on the host use docker-compose.dev.yml instead.
#
# Keycloak's issuer must be the same URL for the browser and for the app container. It is pinned to
# http://localhost:8080; the `keycloak-loopback` sidecar shares the app's network namespace and forwards
# localhost:8080 inside the app container to the keycloak service.
# Separate project name: the dev stack (docker-compose.dev.yml) runs as project "longan".
name: longan-stack

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: longan:latest
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      PORT: "3100"
      APP_URL: http://localhost:3100
      DATABASE_URL: postgres://longan:longan@db:5432/longan
      STORAGE_PATH: /data
      SESSION_SECRET: ${SESSION_SECRET:-change-me-to-32-or-more-random-characters-please}
      OIDC_ISSUER: http://localhost:8080/realms/longan
      OIDC_CLIENT_ID: longan
      OIDC_CLIENT_SECRET: longan-dev-secret
      KEYCLOAK_ADMIN_URL: http://localhost:8080
      LOG_LEVEL: info
    ports: ["127.0.0.1:3100:3100"]
    volumes: [longan-data:/data]
    restart: unless-stopped

  keycloak-loopback:
    image: alpine/socat:latest
    network_mode: "service:app"
    command: ["tcp-listen:8080,fork,reuseaddr", "tcp-connect:keycloak:8080"]
    depends_on: [app]
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: longan
      POSTGRES_PASSWORD: longan
      POSTGRES_DB: longan
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U longan"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_STRICT: "false"
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    restart: unless-stopped

volumes:
  pgdata:
  longan-data:
